<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowCare Skincare</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>GlowCare Skincare</h1>
        <nav>
            <a href="/index.html">Home</a>
            <a href="/about.html">About</a>
            <a href="/contact.html">Order Products</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Care for Your Skin</h2>
        <p>Discover skincare products for your daily routine.</p>
        <a href="#products">Shop Now</a>
    </section>

    <section class="container" id="products">
        <h2>Our Products</h2>
        <div id="products-container" class="products-container"></div>
    </section>

    <section class="container">
        <h2>Manage Products</h2>

        <form id="product-form">
            <input type="hidden" id="product-id">

            <label for="product-name">Product Name</label>
            <input type="text" id="product-name" required>

            <label for="product-price">Price (KSh)</label>
            <input type="number" id="product-price" min="1" required>

            <label for="product-description">Description</label>
            <textarea id="product-description" required></textarea>

            <button type="submit" id="save-button">Add Product</button>
            <button type="button" id="cancel-button" hidden>Cancel</button>
        </form>

        <p id="product-message"></p>
    </section>

    <footer>
        <p>&copy; 2026 GlowCare Skincare</p>
    </footer>
</body>
</html>
