<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Products - GlowCare</title>
    <link rel="stylesheet" href="style.css">
    <script src="contact.js" defer></script>
</head>
<body>
    <header>
        <h1>GlowCare Skincare</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Order Products</a>
        </nav>
    </header>

    <section class="container">
        <h2>Place Your Order</h2>

        <form id="order-form">
            <label for="customer-name">Your Name</label>
            <input type="text" id="customer-name" required>

            <label for="customer-email">Email Address</label>
            <input type="email" id="customer-email" required>

            <label for="customer-phone">Phone Number</label>
            <input type="tel" id="customer-phone" required>

            <label for="order-product">Choose a Product</label>
            <select id="order-product" required>
                <option value="">Select a product</option>
            </select>

            <label for="order-quantity">Quantity</label>
            <input type="number" id="order-quantity" min="1" value="1" required>

            <label for="order-notes">Additional Information</label>
            <textarea id="order-notes"></textarea>

            <button type="submit">Place Order</button>
        </form>

        <p id="order-message"></p>
    </section>

    <footer>
        <p>&copy; 2026 GlowCare Skincare</p>
    </footer>
</body>
</html>
